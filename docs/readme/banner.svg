<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="memora: Durable retrievable memory for your app"><style>:root{--bg:#fdfcff;--bg-sidebar:#f9f7ff;--surface:#f5f2ff;--surface-2:#edeaf8;--surface-3:#e6e3f1;--chip:#d9d5e4;--border:#dfdcea;--border-strong:#c9c6d6;--grid:#ebeaee;--divider:#afabbd;--text:#1a1530;--text-2:#433f55;--text-3:#706d7f;--text-4:#8c8998;--accent:#7c3aed;--accent-strong:#6931c9;--accent-soft:#db2777;--accent-softer:#51269a;--accent-dim:#c3a5f7;--accent-bg:#f5f0fe;--on-accent:#ffffff;--mark-bg:linear-gradient(135deg, #7c3aed, #db2777);--ok:#15803d;--ok-border:#a0cab1;--warn:#d97706;--warn-soft:#b45309;--warn-border:#efc79b;--warn-bg:#faf3ee;--danger:#dc2626;--danger-soft:#b91c1c;--danger-border:#f0a6a8;--danger-bg:#fbf1f4;--info:#0369a1;--info-border:#99c1d9;--shadow:0 18px 44px rgba(15,25,40,.14);--font-sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--font-heading:"Geist", ui-sans-serif, system-ui, sans-serif;--font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;--radius:14px;--mark-radius:6px;--type-scale:1.14}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.d-box { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; rx: 5px; }
