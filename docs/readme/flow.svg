<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="369" viewBox="0 0 1280 369" role="img" aria-label="From source to grounded answer"><style>:root{--bg:#fdfcff;--bg-sidebar:#f9f7ff;--surface:#f5f2ff;--surface-2:#edeaf8;--surface-3:#e6e3f1;--chip:#d9d5e4;--border:#dfdcea;--border-strong:#c9c6d6;--grid:#ebeaee;--divider:#afabbd;--text:#1a1530;--text-2:#433f55;--text-3:#706d7f;--text-4:#8c8998;--accent:#7c3aed;--accent-strong:#6931c9;--accent-soft:#db2777;--accent-softer:#51269a;--accent-dim:#c3a5f7;--accent-bg:#f5f0fe;--on-accent:#ffffff;--mark-bg:linear-gradient(135deg, #7c3aed, #db2777);--ok:#15803d;--ok-border:#a0cab1;--warn:#d97706;--warn-soft:#b45309;--warn-border:#efc79b;--warn-bg:#faf3ee;--danger:#dc2626;--danger-soft:#b91c1c;--danger-border:#f0a6a8;--danger-bg:#fbf1f4;--info:#0369a1;--info-border:#99c1d9;--shadow:0 18px 44px rgba(15,25,40,.14);--font-sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--font-heading:"Geist", ui-sans-serif, system-ui, sans-serif;--font-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;--radius:14px;--mark-radius:6px;--type-scale:1.14}text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
.d-box { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1; rx: 5px; }
.d-box.accent { fill: var(--accent-bg); stroke: var(--accent); }
.d-box.soft { fill: var(--surface-3); stroke: var(--border); }
.d-box.external { fill: var(--bg); stroke: var(--divider); stroke-dasharray: 4 3; }
.d-box.ok { fill: color-mix(in srgb, var(--ok) 8%, var(--surface)); stroke: var(--ok-border); }
.d-box.warn { fill: var(--warn-bg); stroke: var(--warn-border); }
.d-box.danger { fill: var(--danger-bg); stroke: var(--danger-border); }
.d-zone { fill: none; stroke: var(--border-strong); stroke-dasharray: 2 4; rx: 6px; }
.d-zone.trust { fill: color-mix(in srgb, var(--accent) 4%, transparent); stroke: var(--accent-dim); stroke-dasharray: 6 4; }
.d-zone-label { fill: var(--text-4); font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-family: var(--font-sans); }
.d-t { fill: var(--text); font-size: 12px; font-weight: 600; font-family: var(--font-sans); }
.d-s { fill: var(--text-3); font-size: 10.5px; font-family: var(--font-sans); }
.d-m { fill: var(--text-4); font-size: 10px; font-family: var(--font-mono); }
.d-edge { fill: none; stroke: var(--text-4); stroke-width: 1.2; }
.d-edge.accent { stroke: var(--accent-soft); stroke-width: 1.5; }
.d-edge.dash { stroke-dasharray: 4 3; }
.d-edge.warn { stroke: var(--warn); }
.d-edge.ok { stroke: var(--ok); }
.d-edge-label { fill: var(--text-2); font-size: 10px; font-family: var(--font-sans); }
.d-arrow { fill: var(--text-4); }
.d-arrow.accent { fill: var(--accent-soft); }
.d-arrow.warn { fill: var(--warn); }
.d-arrow.ok { fill: var(--ok); }
.d-life { stroke: var(--border-strong); stroke-dasharray: 3 4; }
.d-actor { fill: var(--surface-2); stroke: var(--border-strong); rx: 5px; }
.d-actor.accent { fill: var(--accent-bg); stroke: var(--accent); }
.d-group { fill: color-mix(in srgb, var(--accent) 5%, transparent); stroke: var(--accent-dim); stroke-dasharray: 5 3; rx: 5px; }
.d-group-label { fill: var(--accent-softer); font-size: 10px; font-weight: 600; font-family: var(--font-sans); }
.d-num { fill: var(--accent-strong); rx: 4px; }
.d-num-t { fill: var(--on-accent, #fff); font-size: 10px; font-weight: 700; font-family: var(--font-mono); }
.d-diamond { fill: var(--surface-3); stroke: var(--accent-soft); }
.d-halo { stroke: var(--surface); stroke-width: 4px; paint-order: stroke; }</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fdfcff"/><stop offset="1" stop-color="#f5f0fe"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0" r="0.8"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ebeaee"/></pattern>
</defs>
<rect width="1280" height="369" rx="20" fill="url(#bg)"/><rect width="1280" height="369" rx="20" fill="url(#dots)" opacity="0.7"/><rect width="1280" height="369" rx="20" fill="url(#glow)"/>
<text x="48" y="46" font-size="12" font-weight="700" letter-spacing="2" fill="#db2777">FROM SOURCE TO GROUNDED ANSWER</text>
<svg x="48" y="76" width="1184" height="224.95999999999998" viewBox="0 0 1000 190" role="img" aria-label="Flow diagram" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"><g class="n"><rect class="d-box accent" x="6" y="6" width="88.5" height="88"/><text class="d-t" x="50.3" y="26" text-anchor="middle">1 · Ingest</text><text class="d-t" x="50.3" y="40" text-anchor="middle">Source</text><text class="d-s" x="50.3" y="54" text-anchor="middle">Upload text</text><text class="d-s" x="50.3" y="68" text-anchor="middle">or file</text><text class="d-s" x="50.3" y="82" text-anchor="middle">under Subject</text></g><path class="d-edge accent" d="M96.5 50 L133.5 50"/><polygon class="d-arrow accent" points="133.5,50 127.2,53 127.2,47"/><g class="n"><rect class="d-box accent" x="134.5" y="6" width="88.5" height="88"/><text class="d-t" x="178.8" y="26" text-anchor="middle">2 ·</text><text class="d-t" x="178.8" y="40" text-anchor="middle">Extraction</text><text class="d-s" x="178.8" y="54" text-anchor="middle">Processor +</text><text class="d-s" x="178.8" y="68" text-anchor="middle">agent writes</text><text class="d-s" x="178.8" y="82" text-anchor="middle">v1, v2..</text></g><path class="d-edge accent" d="M225 50 L262 50"/><polygon class="d-arrow accent" points="262,50 255.7,53 255.7,47"/><g class="n"><rect class="d-box accent" x="263" y="6" width="88.5" height="88"/><text class="d-t" x="307.3" y="26" text-anchor="middle">3 ·</text><text class="d-t" x="307.3" y="40" text-anchor="middle">Chunking</text><text class="d-s" x="307.3" y="54" text-anchor="middle">Units to</text><text class="d-s" x="307.3" y="68" text-anchor="middle">blocks to</text><text class="d-s" x="307.3" y="82" text-anchor="middle">retrieval chunks</text></g><path class="d-edge accent" d="M353.5 50 L390.5 50"/><polygon class="d-arrow accent" points="390.5,50 384.2,53 384.2,47"/><g class="n"><rect class="d-box accent" x="391.5" y="6" width="88.5" height="88"/><text class="d-t" x="435.8" y="26" text-anchor="middle">4 ·</text><text class="d-t" x="435.8" y="40" text-anchor="middle">Embeddings</text><text class="d-s" x="435.8" y="54" text-anchor="middle">NIM embed to</text><text class="d-s" x="435.8" y="68" text-anchor="middle">halfvec 2048</text><text class="d-s" x="435.8" y="82" text-anchor="middle">HNSW</text></g><path class="d-edge accent" d="M482 50 L519 50"/><polygon class="d-arrow accent" points="519,50 512.7,53 512.7,47"/><g class="n"><rect class="d-box accent" x="520" y="6" width="88.5" height="88"/><text class="d-t" x="564.3" y="33" text-anchor="middle">5 · Graph</text><text class="d-t" x="564.3" y="47" text-anchor="middle">build</text><text class="d-s" x="564.3" y="61" text-anchor="middle">LLM extract</text><text class="d-s" x="564.3" y="75" text-anchor="middle">to FalkorDB</text></g><path class="d-edge accent" d="M610.5 50 L647.5 50"/><polygon class="d-arrow accent" points="647.5,50 641.2,53 641.2,47"/><g class="n"><rect class="d-box accent" x="648.5" y="6" width="88.5" height="88"/><text class="d-t" x="692.8" y="33" text-anchor="middle">6 ·</text><text class="d-t" x="692.8" y="47" text-anchor="middle">Retrieve</text><text class="d-s" x="692.8" y="61" text-anchor="middle">HNSW top50</text><text class="d-s" x="692.8" y="75" text-anchor="middle">to MMR top10</text></g><path class="d-edge accent" d="M739 50 L776 50"/><polygon class="d-arrow accent" points="776,50 769.7,53 769.7,47"/><g class="n"><rect class="d-box accent" x="777" y="6" width="88.5" height="88"/><text class="d-t" x="821.3" y="26" text-anchor="middle">7 · Rerank</text><text class="d-t" x="821.3" y="40" text-anchor="middle">+ answer</text><text class="d-s" x="821.3" y="54" text-anchor="middle">NIM rerank</text><text class="d-s" x="821.3" y="68" text-anchor="middle">to top5, LLM</text><text class="d-s" x="821.3" y="82" text-anchor="middle">answers</text></g><path class="d-edge warn" d="M821.3 94 L821.3 137"/><polygon class="d-arrow warn" points="821.3,137 818.2,130.7 824.3,130.7"/><text class="d-edge-label d-halo" x="828.3" y="104" text-anchor="start">reranker</text><text class="d-edge-label d-halo" x="828.3" y="116" text-anchor="start">error</text><g class="n"><rect class="d-box warn" x="777" y="138" width="88.5" height="46"/><text class="d-t" x="821.3" y="158" text-anchor="middle">Rerank</text><text class="d-t" x="821.3" y="172" text-anchor="middle">fallback</text></g><path class="d-edge" d="M865.5 50 L885.5 50"/><path class="d-edge ok" d="M885.5 50 L885.5 50 L904.5 50"/><polygon class="d-arrow ok" points="904.5,50 898.2,53 898.2,47"/><g class="n"><rect class="d-box ok" x="905.5" y="13" width="88.5" height="74"/><text class="d-t" x="949.8" y="33" text-anchor="middle">Grounded</text><text class="d-t" x="949.8" y="47" text-anchor="middle">answer</text><text class="d-s" x="949.8" y="61" text-anchor="middle">Only from</text><text class="d-s" x="949.8" y="75" text-anchor="middle">top5 chunks</text></g></svg>
<text x="48" y="334.96" font-size="12.5" fill="#706d7f">Ingest once, then every query reuses the same versioned chunks, vectors, and graph facts.</text>
</svg>