><rect class="d-box " x="558" y="288" width="155" height="46"/><text class="d-t" x="635.5" y="308" text-anchor="middle">Embeddings</text><text class="d-s" x="635.5" y="322" text-anchor="middle">Queue + NIM drain</text></g><g class="n"><rect class="d-box " x="558" y="348" width="155" height="46"/><text class="d-t" x="635.5" y="368" text-anchor="middle">Retrieval</text><text class="d-s" x="635.5" y="382" text-anchor="middle">HNSW MMR rerank LLM</text></g><g class="n"><rect class="d-box " x="558" y="408" width="155" height="60"/><text class="d-t" x="635.5" y="428" text-anchor="middle">Graph Builder</text><text class="d-s" x="635.5" y="442" text-anchor="middle">Per-tenant knowledge</text><text class="d-s" x="635.5" y="456" text-anchor="middle">graph</text></g><g class="n"><rect class="d-box " x="829" y="168" width="155" height="46"/><text class="d-t" x="906.5" y="188" text-anchor="middle">Postgres pgvector</text><text class="d-s" x="906.5" y="202" text-anchor="middle">halfvec 2048 HNSW M16</text></g><g class="n"><rect class="d-box external" x="829" y="228" width="155" height="46"/><text class="d-t" x="906.5" y="248" text-anchor="middle">FalkorDB Graph</text><text class="d-s" x="906.5" y="262" text-anchor="middle">Document Entity Mentions</text></g><g class="n"><rect class="d-box external" x="829" y="288" width="155" height="46"/><text class="d-t" x="906.5" y="308" text-anchor="middle">NVIDIA NIM</text><text class="d-s" x="906.5" y="322" text-anchor="middle">Embed rerank LLM calls</text></g><text class="d-edge-label d-halo" x="552" y="51" text-anchor="end">Bearer memora_ query</text><text class="d-edge-label d-halo" x="552" y="38" text-anchor="end">admin session</text><text class="d-edge-label d-halo" x="177" y="245" text-anchor="start">reads docs</text><text class="d-edge-label d-halo" x="643.5" y="91" text-anchor="start">scope check</text><text class="d-edge-label d-halo" x="643.5" y="121" text-anchor="start">upload + extract</text><text class="d-edge-label d-halo" x="643.5" y="225" text-anchor="start">readings + content</text><text class="d-edge-label d-halo" x="643.5" y="285" text-anchor="start">chunks enqueue</text><text class="d-edge-label d-halo" x="823" y="185" text-anchor="end">vectors HNSW</text><text class="d-edge-label d-halo" x="643.5" y="315" text-anchor="start">content facts</text><text class="d-edge-label d-halo" x="823" y="245" text-anchor="end">entities + edges</text><text class="d-edge-label d-halo" x="643.5" y="218" text-anchor="start">top50 MMR rerank</text><text class="d-edge-label d-halo" x="823" y="172" text-anchor="end">HNSW search</text><text class="d-edge-label d-halo" x="823" y="305" text-anchor="end">embed + rerank</text></svg>
<text x="48" y="680.688" font-size="12.5" fill="#706d7f">Read left to right: apps and console call the FastAPI API, which runs the memory pipeline on Postgres pgvector and FalkorDB.</text>
